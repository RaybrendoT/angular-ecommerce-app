name: Build Push Deploy

on:
  push:
    branches:
      - master

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/frontend

jobs:

  build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: |
          docker build \
            -t $BACKEND_IMAGE:latest \
            ./backend

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        run: |
          docker build \
            -t $FRONTEND_IMAGE:latest \
            ./client


  push-backend:
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Build backend
        run: |
          docker build \
            -t $BACKEND_IMAGE:latest \
            ./backend

      - name: Push backend
        run: |
          docker push $BACKEND_IMAGE:latest


  push-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Build frontend
        run: |
          docker build \
            -t $FRONTEND_IMAGE:latest \
            ./client

      - name: Push frontend
        run: |
          docker push $FRONTEND_IMAGE:latest


  rollout:
    runs-on: ubuntu-latest

    needs:
      - push-backend
      - push-frontend

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Restart K3s deployments
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo k3s kubectl rollout restart deployment/backend -n app-demo && \
            sudo k3s kubectl rollout restart deployment/frontend -n app-demo"